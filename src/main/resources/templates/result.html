<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Encryption Result</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: #f9f9f9;
            text-align: center;
            padding: 40px;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            display: inline-block;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
        }

        h2 {
            color: #2b6777;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            padding: 10px 20px;
            background-color: #52ab98;
            color: white;
            border-radius: 5px;
        }

        a:hover {
            background-color: #3c9583;
        }

        img {
            margin-top: 30px;
            width: 200px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 th:text="${message}">Your message will appear here</h2>
        <a href="/">Back to Upload</a>
        <br><br>
        <img src="/images/Manas Signature.jpg" alt="Signature">
    </div>
</body>
</html>
